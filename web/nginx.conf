# Painel estático e proxy de mesma origem: /api/* vai para a API sem o prefixo, o mesmo contrato do proxy do Vite.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # DNS interno do Docker reavaliado: a API pode ser recriada com outro IP sem reiniciar o painel.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $request_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
