sonar.projectKey=BevilacquaJulio_distributed-wagering-processor
sonar.organization=bevilacquajulio
sonar.projectName=distributed-wagering-processor

sonar.sources=src,scripts,web
sonar.exclusions=**/node_modules/**,dist/**,coverage/**
sonar.tests=tests
sonar.typescript.tsconfigPaths=tsconfig.json,web/tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
# Migrations, scripts administrativos e pontos de entrada dos processos rodam como processos separados
# no job de integração (provision, migrate up/down/up, API, consumidor, publisher e worker), fora da instrumentação do bun test.
sonar.coverage.exclusions=src/infrastructure/postgres/migrations/**,scripts/**,src/main.ts,src/consumer.ts,src/publisher.ts,src/reference-worker.ts,web/vite.config.ts
