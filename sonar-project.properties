sonar.projectKey=BevilacquaJulio_distributed-wagering-processor
sonar.organization=bevilacquajulio
sonar.projectName=distributed-wagering-processor

sonar.sources=src,scripts,web
sonar.exclusions=**/node_modules/**,dist/**,coverage/**
sonar.tests=tests
sonar.typescript.tsconfigPaths=tsconfig.json,web/tsconfig.json

sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
